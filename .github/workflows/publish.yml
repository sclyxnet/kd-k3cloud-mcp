name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# PyPI 可信发布(Trusted Publishing / OIDC)：无需任何 token。
# 前置：在 pypi.org 项目 kingdee-mcp → Manage → Publishing 添加可信发布者，
#       配置 Owner=WaHaiLong, Repository=KingdeeMCP, Workflow=publish.yml, Environment=(空)。
# 本工作流须有 `id-token: write` 权限，twine 会自动用 OIDC 令牌上传。
permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build & twine
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Publish to PyPI (Trusted Publishing, no token)
        run: twine upload dist/*
